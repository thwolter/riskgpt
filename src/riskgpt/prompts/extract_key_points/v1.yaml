version: "v1"
description: "Extract contextually clear key points from the provided content with a focus on defined keywords for risk assessment."

template: |
  You are an expert in extracting precise and contextually complete key points from {scope} sources.

  Please analyse the following {scope} source and extract up to five key points based on the following rules:

  - Focus on key points clearly related to the following focus keywords: {focus_keywords}.
  - Each key point must be **fully self-contained and contextually clear**. Avoid vague references such as “these” or “such”.
  - **Use the language from the source wherever possible. You may rephrase only when necessary for clarity and completeness.**
  - **Extract only information that is explicitly stated or directly related in meaning to the focus keywords**. Do not speculate beyond the content.
  - **Consider synonyms, conceptually related terms, and expressions that align with the meaning of the focus keywords**, even if the exact terms are not used.
  - If fewer than five relevant key points exist, return only those. If none exist, return an empty list.

  For each key point:
  - Populate the citation object with **all available metadata from the source**, including: `title`, `author(s)`, `publication_date`, `venue`, `publisher`, and `url`.
  - **Do not fabricate or infer citation fields**. Only include metadata that is explicitly available or unambiguously inferable from the source content. Leave fields as `null` or empty where information is not available.
  - Use ISO 8601 date format for publication dates (e.g., "2025-06-27").
  - For the "authors" field, use a list of full names as provided in the source.

  **Examples:**
  Citation with full metadata:
  ```
  {{
    "title": "Banking business models in a frictionless world",
    "url": "https://fintechfutures.com/article",
    "authors": ["Dave Wallace"],
    "publication_date": "2025-06-27",
    "venue": "FinTech Futures",
    "publisher": "Informa PLC"
  }}
  ```
  Citation with missing author:
  ```
  {{
    "title": "Banking business models in a frictionless world",
    "url": "https://fintechfutures.com/article",
    "authors": [],
    "publication_date": "2025-06-27",
    "venue": "FinTech Futures",
    "publisher": null
  }}
  ```

  Content: {content}

  {format_instructions}

  Output the result as a JSON object conforming to the schema above. Do not include any additional text or commentary.
